plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// opus-java and tink are only needed for voice
	include("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: 'opus-java'
		exclude module: 'tink'
	}
	implementation("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: 'opus-java'
		exclude module: 'tink'
	}

	include "com.fasterxml.jackson.core:jackson-databind:2.22.2"
	include "com.fasterxml.jackson.core:jackson-annotations:2.22"
	include "com.fasterxml.jackson.core:jackson-core:2.22.2"
	implementation "com.fasterxml.jackson.core:jackson-databind:2.22.2"
	implementation "com.fasterxml.jackson.core:jackson-annotations:2.22"
	implementation "com.fasterxml.jackson.core:jackson-core:2.22.2"

	// JDA's transitive dependencies, which include does not pull in on its own
	include "org.apache.commons:commons-collections4:4.6.0"
	include "com.neovisionaries:nv-websocket-client:2.14"
	include "com.squareup.okhttp3:okhttp-jvm:5.5.0"
	include "com.squareup.okio:okio-jvm:3.18.1"
	include "org.jetbrains.kotlin:kotlin-stdlib:2.2.21"
	include "net.sf.trove4j:core:3.1.0"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 26.1 and above uses Java 25.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		def archivesName = base.archivesName.get()
		rename { "${it}_${archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}